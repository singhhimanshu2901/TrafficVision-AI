version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trafficvision-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_ORIGIN=http://localhost:3000
      - DATABASE_URL=sqlite:////app/storage/trafficvision.db
      - STORAGE_DIR=/app/storage
      - MODEL_PATH=/app/models/yolov8n.pt
      - MODEL_DEVICE=cpu
      - CONFIDENCE_THRESHOLD=0.35
      - INFERENCE_IMAGE_SIZE=416
      - MAX_STREAM_FPS=15
    volumes:
      - trafficvision_data:/app/storage
      - trafficvision_models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trafficvision-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  trafficvision_data:
  trafficvision_models:
